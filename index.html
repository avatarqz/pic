<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <title>《瑜伽师地论》摄异门分 · 加注研究</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="vendor_vue.css">
  <style>
    .wikilink { color:#2c662d; border-bottom:1px dotted #2c662d; text-decoration:none; }
    .wikilink:hover { background:#eaf6ea; }
    .obs-anchor { display:inline; }
    .markdown-section { max-width: 920px; }
    .missing-link { color:#999; }
    /* footnotes */
    .fn-ref { font-size: .72em; vertical-align: super; }
    .fn-ref a, .fn-back { color: #2c662d; text-decoration: none; }
    .footnotes { font-size: .9em; color: #555; margin-top: 2em; }
    .footnotes ol { padding-left: 1.6em; }
    .fn-back { margin-left: .35em; }
  </style>
</head>
<body>
  <div id="app">载入中…</div>
  <script src="vendor_docsify.min.js"></script>
  <script src="vendor_search.min.js"></script>
  <script>
  // Known wikilink targets that have a corresponding page in this repo.
  // Anything else is rendered as plain text (no dead links), since the full
  // vault is not hosted here.
  var KNOWN_PAGES = {
    "README": 1,
    "README.md": 1,
    "06_结论总表": 1,
    "1579-083(2005)_辑注_精简-8": 1,
    "1579-084(2005)_辑注": 1
  };

  // Convert a single Obsidian wikilink [[target#^anchor|label]] -> docsify <a>.
  // Wikilinks may embed Obsidian attributes (data-page / data-source); those are
  // ignored — only target + anchor are used for the link.
  function convertWikilink(inner) {
    inner = inner.replace(/\\\|/g, '|'); // unescape Obsidian's \| alias separator
    var bar = inner.indexOf('|');
    var body = (bar >= 0 ? inner.slice(0, bar) : inner).trim();
    var label = (bar >= 0 ? inner.slice(bar + 1) : '').trim();

    var hashIdx = body.indexOf('#');
    var target = (hashIdx >= 0 ? body.slice(0, hashIdx) : body).trim();
    var anchor = '';
    if (hashIdx >= 0) {
      var am = body.slice(hashIdx + 1).match(/\^?([A-Za-z0-9_\-]+)/);
      if (am) anchor = am[1];
    }

    // Obsidian apparatus links often carry a numeric/bracket alias; use the
    // page name as the visible label in that case.
    if (!label || /^\[?\d+\]?$/.test(label)) label = target;

    if (!target) {
      // same-page anchor only
      if (anchor) {
        return '<a href="#/?id=' + anchor + '" class="wikilink">' + label + '</a>';
      }
      return label;
    }
    // strip a possible path / .md suffix before the membership test
    var bare = target.replace(/^.*\//, '').replace(/\.md$/i, '');
    if (KNOWN_PAGES.hasOwnProperty(target) || KNOWN_PAGES.hasOwnProperty(bare)) {
      var href = '#/' + (KNOWN_PAGES.hasOwnProperty(target) ? target : bare) + (anchor ? '?id=' + anchor : '');
      return '<a href="' + href + '" class="wikilink">' + label + '</a>';
    }
    return label;
  }

  // --- Footnotes ---------------------------------------------------------
  // Obsidian / Markdown footnotes: [^label] reference, [^label]: definition.
  // docsify's markdown engine (marked) does not support them, so we convert
  // them to HTML here. Definitions are gathered page-wide (they may sit in a
  // different paragraph than the references) and re-emitted as one block.
  function extractFootnoteDefs(seg) {
    var lines = seg.split('\n');
    var defs = {}, order = [], out = [];
    var i = 0, n = lines.length;
    while (i < n) {
      var m = lines[i].match(/^(\s*)\[\^([^\]]+)\]:\s?(.*)$/);
      if (m) {
        var label = m[2], body = m[3];
        var j = i + 1;
        while (j < n && /^\s/.test(lines[j])) { body += '\n' + lines[j].replace(/^\s+/, ''); j++; }
        if (!(label in defs)) order.push(label);
        defs[label] = (label in defs ? defs[label] + '\n' + body : body);
        i = j; continue;
      }
      out.push(lines[i]); i++;
    }
    return { defs: defs, order: order, body: out.join('\n') };
  }

  // Strip a leading YAML / Obsidian frontmatter block (--- ... ---) so the
  // raw JSON/TOML metadata does not leak into the rendered page. Only strips
  // when the block actually looks like frontmatter (contains ':' or '{').
  function stripFrontmatter(s) {
    var m = s.match(/^﻿?\s*---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    if (m && /[:{]/.test(m[1])) return s.slice(m[0].length);
    return s;
  }

  // --- Main transform ----------------------------------------------------
  // Applies, in order: footnotes, wikilinks, block-anchors. Fenced code
  // blocks (```) are left untouched. The (?!\]) lookahead lets a wikilink
  // terminate correctly even when its embedded attributes contain square
  // brackets (e.g. data-source="1343|[2]]]"). Footnotes run first so the
  // caret in [^label] is consumed here, never mistaken for a block-anchor.
  function transform(content) {
    if (typeof content !== 'string') return content;
    content = stripFrontmatter(content);
    var parts = content.split('```');
    var allDefs = {}, order = [];

    // 1) pull footnote definitions out of every non-code segment
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) continue;
      var r = extractFootnoteDefs(parts[i]);
      for (var k = 0; k < r.order.length; k++) {
        var lb = r.order[k];
        if (!(lb in allDefs)) { order.push(lb); allDefs[lb] = r.defs[lb]; }
      }
      parts[i] = r.body;
    }

    // 2) convert footnote references to clickable <sup> links
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) continue;
      parts[i] = parts[i].replace(/\[\^([^\]]+)\]/g, function (m, label) {
        if (allDefs.hasOwnProperty(label)) {
          return '<sup class="fn-ref"><a href="#fn-' + label + '" id="fnref-' + label + '">[' + label + ']</a></sup>';
        }
        return '[' + label + ']';
      });
    }

    // 3) wikilinks + standalone block-anchors
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) continue;
      var seg = parts[i];
      seg = seg.replace(/\[\[([\s\S]*?)\]\](?!\])/g, function (m, inner) {
        return convertWikilink(inner);
      });
      seg = seg.replace(/\^([A-Za-z0-9][A-Za-z0-9\-]*)/g, function (m, id) {
        return '<span id="' + id + '" class="obs-anchor"></span>';
      });
      parts[i] = seg;
    }

    var result = parts.join('```');

    // 4) emit a single footnotes block at the end of the page
    if (order.length) {
      var blk = '\n\n<hr class="footnotes-sep">\n\n<section class="footnotes">\n\n<ol>\n';
      for (var k = 0; k < order.length; k++) {
        var l = order[k];
        blk += '<li id="fn-' + l + '">' + allDefs[l] + ' <a href="#fnref-' + l + '" class="fn-back">↩</a></li>\n';
      }
      blk += '</ol>\n\n</section>\n';
      // also convert any wikilinks / anchors inside the definitions
      blk = blk.replace(/\[\[([\s\S]*?)\]\](?!\])/g, function (m, inner) { return convertWikilink(inner); });
      blk = blk.replace(/\^([A-Za-z0-9][A-Za-z0-9\-]*)/g, function (m, id) { return '<span id="' + id + '" class="obs-anchor"></span>'; });
      result += blk;
    }
    return result;
  }

  // Footnote links are same-page anchors. docsify would otherwise treat the
  // bare "#fn-1" hash as a route and 404, so we intercept the click in the
  // capture phase (before docsify's own handler) and scroll natively.
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    // Source-PDF links must open the real file, never be routed by docsify.
    var pdfA = t.closest('a[href]');
    if (pdfA) {
      var ph = pdfA.getAttribute('href') || '';
      if (/\.pdf(\?|$)/i.test(ph)) {
        e.preventDefault();
        e.stopImmediatePropagation();
        // docsify may rewrite /smallpdfs/x.pdf into #/smallpdfs/x.pdf — strip the '#'.
        var real = ph.charAt(0) === '#' ? ph.slice(1) : ph;
        window.open(real, '_blank', 'noopener');
        return;
      }
    }
    // any relative .md link (catalog books) — captured for the route rewrite below
    var mdA = t.closest('a[href]');
    // footnote reference <a> sits inside <sup class="fn-ref">, so match the
    // inner <a> via the descendant combinator; back-links are plain <a class="fn-back">.
    var a = t.closest('sup.fn-ref a, a.fn-back');
    if (a) {
      e.preventDefault();
      e.stopImmediatePropagation();
      var href = a.getAttribute('href') || '';
      var id = href.charAt(0) === '#' ? href.slice(1) : href;
      var el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (history.replaceState) history.replaceState(null, '', '#' + id);
      }
      return;
    }
    // Catalog book links use a relative .md href (no '#'). A raw click does a
    // full-document navigation to the raw file, which the server sends as
    // text/markdown WITHOUT charset — the browser mis-decodes the UTF-8 bytes
    // (Latin-1) and the whole page renders as mojibake. Route them through the
    // docsify SPA instead; docsify fetches .md as UTF-8.
    if (mdA) {
      var mh = mdA.getAttribute('href') || '';
      if (mh.charAt(0) !== '#' && mh.indexOf('://') === -1 && /\.md$/i.test(mh)) {
        e.preventDefault();
        e.stopImmediatePropagation();
        var route = mh.replace(/^\/+/, '').replace(/\.md$/i, '');
        // Catalog .md hrefs are relative paths that may already be
        // percent-encoded (e.g. "INDIAN_PHILOSOPHY%20Lewis" for a literal
        // space) and/or carry raw non-ASCII (e.g. CJK). Re-encoding an
        // already-encoded segment would double-encode %20 -> %2520 and
        // 404. Normalize each segment by decoding then re-encoding, so
        // encoded and raw characters both end up correctly single-encoded.
        route = route.split('/').map(function (seg) {
          try { return encodeURIComponent(decodeURIComponent(seg)); }
          catch (err) { return seg; }
        }).join('/');
        location.hash = '#/' + route;
        return;
      }
    }
  }, true);

  // Apply the ebooks title filter to the catalog page currently in the DOM.
  // Shared by the catalog's own input and the sidebar search box (which navigates
  // here with ?ebookq=<keyword>). 'q' overrides the input value when provided.
  function applyEbookFilter(q) {
    var input = document.getElementById('ebook-filter');
    if (!input) return;
    if (typeof q === 'string') input.value = q;
    q = (input.value || '').trim().toLowerCase();
    var groups = Array.prototype.slice.call(document.querySelectorAll('.ebook-group'));
    var nohit = document.getElementById('ebook-nohit');
    var totalVisible = 0;
    groups.forEach(function (g) {
      var items = g.querySelectorAll('.ebook-item');
      var visible = 0;
      Array.prototype.forEach.call(items, function (li) {
        var hit = !q || (li.getAttribute('data-title') || '').toLowerCase().indexOf(q) >= 0;
        li.style.display = hit ? '' : 'none';
        if (hit) visible++;
      });
      var cnt = g.querySelector('.ebook-count');
      if (cnt) cnt.textContent = visible;
      g.style.display = visible ? '' : 'none';
      totalVisible += visible;
    });
    if (nohit) nohit.style.display = totalVisible ? 'none' : '';
  }

  window.$docsify = {
    name: '《瑜伽师地论》摄异门分 · 加注研究',
    repo: 'avatarqz/pic',
    homepage: 'README.md',
    loadSidebar: true,
    subMaxLevel: 3,
    auto2top: true,
    // Keep /smallpdfs/*.pdf links as raw browser links (don't rewrite into #/ routes)
    noCompileLinks: ['/smallpdfs/[^"\\s]+\\.pdf'],
    search: {
      maxAge: 86400000,
      placeholder: '搜寻（全文）',
      noData: '找不到结果',
      depth: 6
    },
    plugins: [
      function (hook, vm) {
        hook.beforeEach(function (content, next) {
          next(transform(content));
        });
      },
      // Live title filter on the ebooks catalog page (ebooks/README.md), plus
      // a book-title search box in the sidebar. Enter in the sidebar box jumps
      // to the catalog carrying the keyword in ?ebookq=; doneEach fills it back
      // in. markdown <script> tags are not executed by docsify, so do all of
      // this in plugins.
      function (hook, vm) {
        hook.doneEach(function () {
          // catalog page input
          var input = document.getElementById('ebook-filter');
          if (input) {
            var q = vm.route && vm.route.query && vm.route.query.ebookq;
            if (q) applyEbookFilter(q);
            input.addEventListener('input', function () { applyEbookFilter(); });
          }
          // sidebar search box (inject once; docsify rebuilds sidebar per page)
          var nav = document.querySelector('.sidebar-nav');
          if (!nav || document.getElementById('ebook-side-search')) return;
          var box = document.createElement('div');
          box.className = 'ebook-side-search';
          box.style.cssText = 'padding:6px 10px 4px;';
          box.innerHTML = '<input id="ebook-side-search" type="search" ' +
            'placeholder="搜索三库书名（回车跳转总目）" ' +
            'style="width:100%;box-sizing:border-box;padding:.45em .6em;' +
            'border:1px solid #ccc;border-radius:4px;font-size:.9em;">';
          nav.parentNode.insertBefore(box, nav);
          document.getElementById('ebook-side-search').addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            var v = this.value.trim();
            location.hash = '#/all-catalog.md' + (v ? '?ebookq=' + encodeURIComponent(v) : '');
          });
        });
      },
      // Auto-build the sidebar by traversing every .md in the repo (GitHub
      // tree API). Cached in localStorage; the static _sidebar.md is kept as a
      // fallback if the API call fails.
      function (hook, vm) {
        function enc(p) { return p.split('/').map(encodeURIComponent).join('/'); }
        // Folders / files excluded from the navigation (files stay in the repo).
        var EXCLUDE = [
          'src/site/notes/deepin_md/ebooks/[OCR]_神经症 (许又新) .md',
          'src/site/notes/deepin_md/keynotes/index.md',
          'src/site/notes/mindful/README.md'
        ];
        function isExcluded(p) {
          // Keep the big collections out of the auto tree nav; a single fixed
          // index link for each is injected in renderSidebar instead:
          // smallpdfs/ (629), ebooks/ (242), 04journal/ (51, PTS 各期不铺开).
          return EXCLUDE.indexOf(p) >= 0 || p === 'all-catalog.md' ||
            p.indexOf('src/site/notes/') === 0 || p.indexOf('smallpdfs/') === 0 ||
            p.indexOf('ebooks/') === 0 || p.indexOf('04journal/') === 0;
        }
        function renderSidebar(tree) {
          var nav = document.querySelector('.sidebar-nav');
          if (!nav) return;
          var mds = tree.filter(function (t) {
            return t.path.endsWith('.md') && t.path !== '_sidebar.md' && !isExcluded(t.path);
          });
          var hasRootReadme = mds.some(function (t) { return t.path === 'README.md'; });
          var groups = {};
          mds.forEach(function (t) {
            var ps = t.path.split('/');
            var g = ps.length > 1 ? ps[0] : '(root)';
            (groups[g] = groups[g] || []).push(t.path);
          });
          var html = '<ul class="app-sub-sidebar">';
          if (hasRootReadme) {
            html += '<li><a href="#/README.md">首页</a></li>';
          }
          // Fixed local entries: not guaranteed to be in the GitHub tree (served locally).
          html += '<li><a href="#/all-catalog.md">三库合并总目（1018 篇 · 统一搜索）</a></li>';
          html += '<li><a href="#/smallpdfs/zh/README.md">论文译文总目（629 篇）</a></li>';
          html += '<li><a href="#/ebooks/README.md">电子书库总目（242 篇）</a></li>';
          html += '<li><a href="#/pts.md">PTS 学报总目</a></li>';
          Object.keys(groups).sort().forEach(function (g) {
            if (g === '(root)') {
              groups[g].sort().forEach(function (p) {
                if (p === 'README.md') return;
                var label = p.replace(/\.md$/, '');
                html += '<li><a href="#/' + enc(p) + '">' + label + '</a></li>';
              });
            } else {
              html += '<li>' + g + '<ul>';
              groups[g].sort().forEach(function (p) {
                var label = p.split('/').pop().replace(/\.md$/, '');
                html += '<li><a href="#/' + enc(p) + '">' + label + '</a></li>';
              });
              html += '</ul></li>';
            }
          });
          html += '</ul>';
          nav.innerHTML = html;
        }
        hook.mounted(function () {
          var CK = 'pic_sidebar_tree_v1';
          try {
            var c = JSON.parse(localStorage.getItem(CK));
            if (c) renderSidebar(c);
          } catch (e) {}
          fetch('https://api.github.com/repos/avatarqz/pic/git/trees/main?recursive=1')
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d && d.tree) {
                try { localStorage.setItem(CK, JSON.stringify(d.tree)); } catch (e) {}
                renderSidebar(d.tree);
              }
            })
            .catch(function () {});
        });
      }
    ]
  };
  </script>
</body>
</html>
